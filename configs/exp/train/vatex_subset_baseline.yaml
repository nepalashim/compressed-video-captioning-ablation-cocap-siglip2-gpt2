# @package _global_
#
# Phase 3 — reproduce the CoCap baseline (CLIP ViT-B/16 encoder + BERT-style decoder) on the
# VATEX subset. This run produces the numbers every later variant is measured against.

defaults:
  - /model@model: cocap
  - /exp/train/vatex_subset_base
  - _self_
  - /budget: paper
  - /reader: decode

trainer:
  default_root_dir: "./logs/vatex_subset_baseline"

model:
  cocap_model:
    compressed_video_transformer:
      pretrained_clip_name_or_path: "ViT-B/16"
      motion_channels: 2      # matches the dataset's cv_config.motion_channels
      n_bp_type: 3            # P / B / padding
    caption_head:
      pretrained_clip_name_or_path: "ViT-B/16"
      max_t_len: 32           # matches the dataset's max_words
