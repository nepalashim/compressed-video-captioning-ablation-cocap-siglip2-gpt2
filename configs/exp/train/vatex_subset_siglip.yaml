# @package _global_
#
# Phase 4 — swap the I-frame encoder to SigLIP2, keep the baseline BERT-style decoder.
# Isolates the contribution of the vision encoder.

defaults:
  - /model@model: cocap_siglip
  - /exp/train/vatex_subset_base
  - _self_
  - /budget: paper
  - /reader: decode

trainer:
  default_root_dir: "./logs/vatex_subset_siglip_seed${seed}"

# SigLIP normalizes with mean = std = 0.5, not the ImageNet statistics the CLIP baseline uses.
train_dataloader:
  dataset:
    normalize_mean: [0.5, 0.5, 0.5]
    normalize_std: [0.5, 0.5, 0.5]
val_dataloader:
  dataset:
    normalize_mean: [0.5, 0.5, 0.5]
    normalize_std: [0.5, 0.5, 0.5]

model:
  cocap_model:
    compressed_video_transformer:
      pretrained_model_name_or_path: "google/siglip2-base-patch16-224"
      freeze_backbone: false
      backbone_gradient_checkpointing: true   # 8 GB: trade compute for activation memory
      motion_channels: 2
      n_bp_type: 3
    caption_head:
      pretrained_clip_name_or_path: "ViT-B/16"  # decoder side is unchanged
      visual_feature_size: 768                  # SigLIP2-base width, was 512 under CLIP
      max_t_len: 32
